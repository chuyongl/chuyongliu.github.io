<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安娜的奇思妙想</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inconsolata:wght@400;500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf8f4;
      --text: #1a1a18;
      --muted: #888880;
      --accent: #8b3a2a;
      --link: #2a5c8b;
      --border: #ddd9d0;
      --nav-bg: #f0ece3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'EB Garamond', 'Noto Serif SC', 'Songti SC', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
      line-height: 1.7;
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    nav {
      width: 130px;
      min-height: 100vh;
      background: var(--nav-bg);
      border-right: 1px solid var(--border);
      padding: 36px 0;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    nav a {
      display: block;
      padding: 6px 20px;
      font-family: 'Inconsolata', 'Noto Serif SC', monospace;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.15s;
    }

    nav a:hover { color: var(--accent); }
    nav a.active { color: var(--accent); font-weight: 600; }

    /* ── Main content ── */
    main {
      flex: 1;
      padding: 60px 64px;
      max-width: 760px;
    }

    /* ── Name header ── */
    .site-name {
      font-family: 'EB Garamond', 'Noto Serif SC', serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #c8c0b0;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 48px;
      user-select: none;
    }

    /* ── Section headings ── */
    h2 {
      font-family: 'EB Garamond', serif;
      font-size: 22px;
      font-weight: 500;
      font-style: italic;
      color: var(--text);
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    /* ── Content sections ── */
    section {
      margin-bottom: 52px;
    }

    /* ── Bio text ── */
    .bio p {
      margin-bottom: 12px;
      color: #3a3a36;
    }

    /* ── Lists ── */
    .item-list {
      list-style: none;
    }

    .item-list li {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .item-list li::before {
      content: '▪';
      color: var(--accent);
      font-size: 12px;
      flex-shrink: 0;
    }

    .item-list a {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s, color 0.15s;
    }

    .item-list a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .item-list .meta {
      font-family: 'Inconsolata', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ── Contact ── */
    .contact-line {
      font-family: 'Inconsolata', monospace;
      font-size: 14px;
      color: var(--muted);
    }

    .contact-line a {
      color: var(--link);
      text-decoration: none;
    }

    .contact-line a:hover { color: var(--accent); }

    /* ── Page sections (hidden by default) ── */
    .page { display: none; }
    .page.active { display: block; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      nav { width: 90px; }
      main { padding: 40px 24px; }
      nav a { padding: 6px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="#" class="active" onclick="showPage('home', this)">首页</a>
  <a href="#" onclick="showPage('essays', this)">文章</a>
  <a href="#" onclick="showPage('about', this)">关于</a>
</nav>

<main>
  <div class="site-name">安娜的奇思妙想</div>

  <!-- HOME -->
  <div id="page-home" class="page active">
    <section class="bio">
      <p>欢迎。这里记录我最近在思考的事情——一些想法、一些文字，还有那些值得被长久保存下来的东西。</p>
      <p>如果不知道从哪里开始，可以先看看<a href="#" onclick="showPage('essays', null)" style="color:var(--link)">文章</a>。</p>
    </section>

    <section>
      <h2>近期</h2>
      <ul class="item-list">
        <li>
          <a href="dream.html">梦想是我的刚需</a>
          <span class="meta">— 2026年11月</span>
        </li>
        <li>
          <a href="slow-thinking.html">慢思考的价值</a>
          <span class="meta">— 2026年5月</span>
        </li>
      </ul>
    </section>
  </div>

  <!-- ESSAYS -->
  <div id="page-essays" class="page">
    <section>
      <h2>文章</h2>
      <ul class="item-list">
        <li><a href="dream.html">梦想是我的刚需</a><span class="meta">2026</span></li>
        <li><a href="slow-thinking.html">慢思考的价值</a><span class="meta">2026</span></li>
      </ul>
    </section>
  </div>


  <!-- ABOUT -->
  <div id="page-about" class="page">
    <section class="bio">
      <h2>关于</h2>
      <p>我是 Chuyong Liu。</p>
      <p>这个网站用来存放我想留下来的文字和作品。它刻意保持简单。</p>
    </section>
  </div>

</main>

<script>
  function showPage(name, linkEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
    if (linkEl) linkEl.classList.add('active');
    else {
      const nav = document.querySelector(`nav a[onclick*="'${name}'"]`);
      if (nav) nav.classList.add('active');
    }
  }
  // 支持从文章页通过 #essays 等链接直接打开对应栏目
  const h = location.hash.replace('#', '');
  if (['home','essays','about'].includes(h)) showPage(h, null);
</script>

</body>
</html>
